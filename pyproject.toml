[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "indicvoice"
version = "0.2.1"
description = "Indic Translate-and-Speak Pipeline using IndicTrans2 and Indic Parler-TTS"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [
    {name = "IndicVoice Contributors"}
]
dependencies = [
    "pyyaml>=6.0.1",
    "python-dotenv>=1.0.1",
    "pydantic>=2.6.0",
    "soundfile>=0.12.1",
    "numpy>=1.24.0,<2.0.0",
    "scipy>=1.11.0",
    "huggingface-hub>=0.22.0",
]

[project.optional-dependencies]
ml = [
    "torch>=2.1.0,<2.5.0",
    "torchaudio>=2.1.0,<2.5.0",
    "transformers>=4.43.0",
    "sentencepiece>=0.2.0",
    "protobuf>=4.25.0",
    "accelerate>=0.28.0",
]
api = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "httpx>=0.27.0",
]
ui = [
    "gradio>=4.26.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "black>=24.2.0",
    "ruff>=0.3.0",
]

[project.scripts]
indicvoice = "indicvoice.__main__:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v"
